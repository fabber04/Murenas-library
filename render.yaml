services:
  - type: web
    name: murenas-students-library
    env: node
    plan: starter
    rootDir: server
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:migrate:deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: UPLOADS_DIR
        value: /opt/render/project/src/server/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: murenas-library-db
          property: connectionString
    disk:
      name: uploads-disk
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: murenas-library-db
    plan: free
    databaseName: murenas_library
    user: murenas_user
