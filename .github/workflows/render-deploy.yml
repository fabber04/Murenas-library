name: Trigger Render deploy

on:
  push:
    branches: [ main ]

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Trigger Render deploy via API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_SERVICE_ID" ]; then echo "RENDER_SERVICE_ID not set - skipping"; exit 0; fi
          echo "Triggering deploy for Render service $RENDER_SERVICE_ID"
          curl -sS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true}'
