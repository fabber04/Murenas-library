name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Build documentation site
        run: |
          mkdir -p _site
          # Copy docs to _site
          cp -r docs/* _site/ 2>/dev/null || true
          cp README.md _site/ 2>/dev/null || true
          cp PROJECT_STATUS.txt _site/ 2>/dev/null || true
          # Create index.html page
          echo '<!DOCTYPE html>' > _site/index.html
          echo '<html lang="en">' >> _site/index.html
          echo '<head>' >> _site/index.html
          echo '  <meta charset="UTF-8">' >> _site/index.html
          echo '  <meta name="viewport" content="width=device-width, initial-scale=1.0">' >> _site/index.html
          echo '  <title>Murena'\''s Students Library - Documentation</title>' >> _site/index.html
          echo '  <style>' >> _site/index.html
          echo '    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; line-height: 1.6; }' >> _site/index.html
          echo '    h1 { color: #2563eb; }' >> _site/index.html
          echo '    ul { list-style: none; padding: 0; }' >> _site/index.html
          echo '    li { margin: 0.5rem 0; }' >> _site/index.html
          echo '    a { color: #2563eb; text-decoration: none; }' >> _site/index.html
          echo '    a:hover { text-decoration: underline; }' >> _site/index.html
          echo '  </style>' >> _site/index.html
          echo '</head>' >> _site/index.html
          echo '<body>' >> _site/index.html
          echo '  <h1>Murena'\''s Students Library Documentation</h1>' >> _site/index.html
          echo '  <p>Welcome to the project documentation.</p>' >> _site/index.html
          echo '  <h2>Available Documentation</h2>' >> _site/index.html
          echo '  <ul>' >> _site/index.html
          find docs -name "*.md" -type f 2>/dev/null | sed 's|docs/||' | sed 's|\.md||' | while read file; do
            echo "    <li><a href=\"$file\">$file</a></li>" >> _site/index.html
          done
          echo '  </ul>' >> _site/index.html
          echo '  <hr>' >> _site/index.html
          echo '  <p><a href="README.md">README</a> | <a href="PROJECT_STATUS.txt">Project Status</a></p>' >> _site/index.html
          echo '</body>' >> _site/index.html
          echo '</html>' >> _site/index.html
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

